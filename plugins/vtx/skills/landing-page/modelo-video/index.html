<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #140b33; }
      #root { position: absolute; inset: 0; overflow: hidden; background: linear-gradient(180deg, #0f0826 0%, #241352 45%, #3a2486 100%); }
      #mundo { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="41.41" data-width="1080" data-height="1920">
      <canvas id="mundo" width="1080" height="1920" data-layout-allow-overflow></canvas>
      <audio id="voz" class="clip" data-start="0" data-duration="41.41" data-track-index="0" data-volume="1" src="assets/voz.m4a"></audio>
      <div id="ui" class="clip" data-composition-id="ui" data-composition-src="compositions/ui.html" data-start="0" data-duration="41.41" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 10"></div>
      <div id="legendas" class="clip" data-composition-id="legendas" data-composition-src="compositions/legendas.html" data-start="0" data-duration="41.41" data-track-index="3" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index: 40"></div>
    </div>
    <script src="assets/cues.js"></script>
    <script src="assets/mundo.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.set("#mundo", { opacity: 1 }, 0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
